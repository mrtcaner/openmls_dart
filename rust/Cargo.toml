[package]
name = "openmls_frb"
version = "3.1.0"
edition = "2024"
rust-version = "1.88"
description = "Dart wrapper for OpenMLS — a Rust implementation of the Messaging Layer Security (MLS) protocol (RFC 9420)"
repository = "https://github.com/mrtcaner/openmls_dart"
license = "MIT"
publish = false

[lib]
name = "openmls_frb"
# rlib is required so the fuzz crate (rust/fuzz) can link against this crate.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Generator for committed native receive v1 binary interop fixtures. Excluded
# from package/release builds.
native-receive-fixtures = []
account-envelope-fuzzing = []

[dependencies]
flutter_rust_bridge = "=2.12.0"
thiserror = "2.0"
log = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minicbor = { version = "2.3.0", features = ["std"] }
futures = "0.3"
parking_lot = "0.12"
sha2 = "0.10"
# Protocol NFC normalization is pinned to Unicode 17.0.0. Default full case
# folding uses the package-owned generated Unicode 17 table beside the codec.
# Do not loosen this without updating cross-language fixtures and the protocol.
unicode-normalization = "=0.1.25"
openmls = { git = "https://github.com/openmls/openmls", tag = "openmls-v0.8.1", features = ["test-utils"] }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", tag = "openmls-v0.8.1" }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", tag = "openmls-v0.8.1", features = ["test-utils"] }
openmls_traits = { git = "https://github.com/openmls/openmls", tag = "openmls-v0.8.1" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# OpenMLS requires `js` feature for WASM: enables fluvio_wasm_timer for time access
# Cargo merges features from [dependencies] and [target.*.dependencies]
openmls = { git = "https://github.com/openmls/openmls", tag = "openmls-v0.8.1", features = ["js"] }
# Diamond dependency: some upstream crates use getrandom 0.2, some use 0.3
# Both need to be configured for WASM to work correctly
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Performance"] }

[profile.release]
lto = true
opt-level = "z"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[[example]]
name = "native_receive_v1_export_vectors"
required-features = ["native-receive-fixtures"]

# Turn silent integer wraparound into a deterministic panic — but ONLY for this
# crate's own code. Applying overflow-checks tree-wide would change the release
# arithmetic of audited upstream dependencies, some of which rely on wrapping.
[profile.release.package.openmls_frb]
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
# Hand-written code denies unsafe by default. The generated FRB bridge is the
# only module that opts out (with an explicit allow in lib.rs).
unsafe_code = "deny"
